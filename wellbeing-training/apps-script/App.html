<script>
'use strict';
const SCALE={1:'Not yet competent',2:'Developing',3:'Competent',4:'Proficient'};
const STATUS={not:'Not started',progress:'In progress',submitted:'Awaiting review',complete:'Complete',partial:'Partial',rework:'Rework',exempt:'Exempt'};
const OUTCOME={complete:['Complete','Meets the standard'],partial:['Partial','Some is there; say what is missing'],rework:['Rework','Not yet; trainee redoes and resubmits'],exempt:['Exempt','Not needed, for example prior experience']};
const LEVEL={notcleared:'Not cleared for cases',supervised:'Cleared for supervised practice',independent:'Cleared for independent cases'};
const RANK={notcleared:0,supervised:1,independent:2};
let D=null,busy=false,SET=null,PH=null,CHANGES=null,NEWBADGES=new Set();
const UI={view:null,tid:null,cycle:null,rvFilter:null,editTrainee:null,editTopic:null,tpf:null,editTask:null,tf:null,archived:false,log:null};
const openSet=new Set(),DRAFT={},RES={};
const FILES={},VIEWING=new Set(); // downloaded evidence (kept so a viewer survives a re-render) and which viewers are open

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r)=>(r||document).querySelector(s);
const isStaff=()=>!!D&&(D.me.role==='Admin'||D.me.role==='Assessor');
const isAdmin=()=>!!D&&D.me.role==='Admin';
const slug=s=>String(s).replace(/\W/g,'_');
const isUrl=u=>/^https?:\/\//i.test(u||'');
const T=id=>D.trainees.find(t=>t.id===id);
const P=(tr,id)=>tr.p[id]||{status:'not',files:[]};
const topicOf=id=>D.topics.find(t=>t.id===id)||{name:'Topic '+id,w:0};
const phaseOf=c=>{const p=D.config.phases.find(x=>c>=x.from&&c<=x.to);return p?p.name:''};
const phaseShort=c=>phaseOf(c).replace(/^Phase \d+\s*[-:]\s*/,'');
const fmtDate=d=>{if(!d)return'';try{return new Date(String(d).slice(0,10)+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}};
const fmtShort=d=>{try{return new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}catch(e){return d}};
const mb=n=>n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB';
const dk=(tid,task,f)=>tid+'|'+task+'|'+f;
const dv=(tid,task,f,fb)=>{const k=dk(tid,task,f);return k in DRAFT?DRAFT[k]:fb};
const phaseIdx=c=>{const i=D.config.phases.findIndex(p=>c>=p.from&&c<=p.to);return(i<0?0:i)%4};
const pcv=c=>{const n=phaseIdx(c)+1;return`--pc:var(--p${n});--pci:var(--p${n}i);--pcn:var(--p${n}n)`};
const resFor=t=>D.res.filter(r=>r.task===t.id).concat(D.res.filter(r=>r.topic===t.topic&&!r.task));

function call(fn,...args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args))}
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',err?7000:2500)}
function pendingTotal(){return D.trainees.reduce((a,t)=>a+(t.active?t.stats.pending:0),0)}
function setData(d){
  D=d;if(!D.tasks)return;
  D.tasks.sort((a,b)=>a.cycle-b.cycle||a.order-b.order);
  const staff=isStaff();
  if(!UI.view)UI.view=staff&&pendingTotal()?'review':'trainee';
  const act=D.trainees.filter(t=>t.active);
  if(staff){if(!UI.tid||!act.some(t=>t.id===UI.tid))UI.tid=(act[0]||{}).id}else UI.tid=D.me.email;
}
async function run(fn,args,ok,start,after){
  if(busy)return;busy=true;document.body.classList.add('busy');if(start)toast(start);
  try{setData(await call(fn,...args));if(after)after();toast(ok)}catch(e){toast((e&&e.message)||String(e),true)}
  finally{busy=false;document.body.classList.remove('busy');render()}
}

/* ---------- shell ---------- */
function render(){
  const app=$('#app');
  if(!D){app.innerHTML=`<div class="center">${emptyArt('seed')}<h2>Loading your training</h2><p class="muted">One moment.</p></div>`;return}
  if(D.me.role==='None'){app.innerHTML=`<div class="center">${emptyArt('lock')}<h1>You're not enrolled yet</h1><p class="muted">You're signed in as ${esc(D.me.email||'an unknown account')}. Ask the Well-being TL to enrol you, then reload this page.</p></div>`;return}
  const staff=isStaff(),pend=staff?pendingTotal():0;
  const tabs=staff?[['review','Reviews'],['trainee','Trainee'],['team','Team']].concat(isAdmin()?[['curriculum','Curriculum']]:[]).concat([['guide','Guide']]):[['trainee','My training'],['guide','Guide']];
  const v=UI.view;
  const act=D.trainees.filter(t=>t.active);
  app.innerHTML=`${MEDAL_DEFS}
  <header class="top"><div class="top-in">
    <div class="brand"><span class="logo">${LOGO}</span><span>${esc(D.config.appName)}<small>${esc(D.config.orgName)}</small></span></div>
    <nav class="tabs" aria-label="Sections">${tabs.map(([k,l])=>`<button class="tab" data-act="view" data-v="${k}" ${v===k?'aria-current="page"':''}>${l}${k==='review'&&pend?`<span class="count">${pend}</span>`:''}</button>`).join('')}</nav>
    <span class="who-chip">${esc(D.me.name||D.me.email)}, ${D.me.role==='Admin'?'admin':D.me.role==='Assessor'?'assessor':'trainee'}</span>
  </div></header>
  ${v==='trainee'&&staff&&act.length?`<div class="proto"><label>Trainee <select data-act="pick" aria-label="Choose trainee">${act.map(t=>`<option value="${esc(t.id)}" ${t.id===UI.tid?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><span>You're viewing their training. Only they can submit work; you can record assessments.</span></div>`:''}
  <main>${v==='trainee'?vTrainee():v==='review'?vReview():v==='team'?vTeam():v==='curriculum'?vCurriculum():vGuide()}</main>`;
  mountViewers();
  if(!UI.introDone){UI.introDone=true;document.body.classList.add('intro');countUp();setTimeout(()=>document.body.classList.remove('intro'),1700)}
}

/* ---------- milestones, since you last visited, and celebrations ---------- */
function milestones(tr){
  const s=tr.stats,act=D.tasks.filter(t=>t.active),isDone=t=>['complete','exempt'].includes(P(tr,t.id).status),icons=['book','target','eye','flag'];
  const L=[{id:'first',icon:'check',title:'First task done',on:act.some(isDone)},{id:'gate',icon:'shield',title:'First gate passed',on:s.gatesPassed>=1}];
  D.config.phases.slice(0,-1).forEach((p,i)=>{const ts=act.filter(t=>t.cycle>=p.from&&t.cycle<=p.to);L.push({id:'ph'+i,icon:icons[i%4],title:p.name.replace(/^Phase \d+\s*[-:]\s*/,'')+' complete',on:ts.length>0&&ts.every(isDone)})});
  L.push({id:'half',icon:'spark',title:'Halfway there',on:s.completion>=50},{id:'sup',icon:'users',title:'Supervised practice',on:RANK[s.effective]>=1},{id:'ind',icon:'star',title:'Independent practice',on:RANK[s.effective]>=2});
  return L;
}
function detectChanges(){
  if(!D||D.me.role!=='Trainee'||!D.trainees[0])return;
  const tr=D.trainees[0],key='wb:seen:'+D.me.email,badges=milestones(tr),now={s:{},lv:tr.stats.effective,b:badges.filter(b=>b.on).map(b=>b.id)};let prev=null;
  try{prev=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}
  D.tasks.forEach(t=>{if(t.active)now.s[t.id]=P(tr,t.id).status});
  try{localStorage.setItem(key,JSON.stringify(now))}catch(e){}
  if(!prev)return;   // first visit on this device: nothing to compare with
  const ch=[];let party=false,big=false;
  D.tasks.forEach(t=>{
    if(!t.active)return;const a=prev.s[t.id]||'not',b=now.s[t.id];if(a===b)return;
    const p=P(tr,t.id),name=`<b>${esc(t.id)} ${esc(t.name)}</b>`,fb=p.feedback?` &ldquo;${esc(p.feedback.slice(0,140))}${p.feedback.length>140?'…':''}&rdquo;`:'';
    if(b==='complete'||b==='exempt'){ch.push({k:'good',i:'check',h:`${name} was marked ${STATUS[b].toLowerCase()}${p.score?' ('+p.score+' of 4)':''}.${fb}`});party=true}
    else if(b==='partial')ch.push({k:'warn',i:'spark',h:`${name} needs a little more work.${fb}`});
    else if(b==='rework')ch.push({k:'bad',i:'refresh',h:`${name} needs another attempt.${fb}`});
  });
  if(RANK[now.lv]>RANK[prev.lv||'notcleared']){ch.unshift({k:'star',i:'star',h:`You're now <b>${LEVEL[now.lv].toLowerCase()}</b>.`});big=true}
  if(prev.b)badges.filter(b=>b.on&&!prev.b.includes(b.id)).forEach(b=>{NEWBADGES.add(b.id);ch.push({k:'star',i:'star',h:`You earned the <b>${esc(b.title)}</b> medal.`});party=true});
  CHANGES=ch.length?ch:null;
  if(big)celebrate(true);else if(party)celebrate(false);
}
const changesCard=()=>`<section class="changes" aria-label="Since you last visited"><div class="hd"><h3>${ico('spark')} Since you last visited</h3><button class="btn ghost small" data-act="dismiss-changes">Dismiss</button></div><ul>${CHANGES.map(c=>`<li class="${c.k}"><span class="badge">${ico(c.i,14)}</span><span>${c.h}</span></li>`).join('')}</ul></section>`;

/* ---------- trainee view ---------- */
const LEVEL_SHORT={notcleared:'Not cleared',supervised:'Supervised',independent:'Independent'};
const paceGap=tr=>tr.stats.completion-tr.stats.expectedPct;
const paceState=tr=>{const s=tr.stats;if(s.calendarState==='unknown'||s.calendarState==='notstarted')return s.calendarState;if(s.finished)return'done';const g=paceGap(tr);return g<-10?'behind':g>10?'ahead':'on'};
const pts=n=>Math.abs(n)+' point'+(Math.abs(n)===1?'':'s');
function paceChip(tr){
  const st=paceState(tr),g=paceGap(tr),tip='Compares completion with where the calendar says the work should be by today.';
  if(st==='unknown')return`<span class="chip warn">No start date set</span>`;
  if(st==='notstarted')return`<span class="chip">Starts ${fmtDate(tr.start)}</span>`;
  if(st==='done')return`<span class="chip good">All cycles worked through</span>`;
  if(st==='behind')return`<span class="chip warn" title="${tip}">${pts(g)} behind the calendar</span>`;
  if(st==='ahead')return`<span class="chip good" title="${tip}">${pts(g)} ahead of the calendar</span>`;
  return`<span class="chip good" title="${tip}">On track with the calendar</span>`;
}

function readyCard(tr){
  const s=tr.stats,lv=s.effective,c=D.config,staff=isStaff();
  const gateCycle=tr.pathway==='Urgent'?c.urgentGateCycle:c.supervisedGateCycle;
  const lines=[];
  if(lv==='notcleared')lines.push(`Pass every critical gate up to cycle ${gateCycle} to become eligible for supervised practice.`);
  if(lv==='supervised')lines.push('Can take cases with a supervisor present. Pass the remaining critical gates for independent cases.');
  if(lv==='independent')lines.push('All critical gates passed and signed off.');
  if(s.needsReview)lines.push(`Clearance on record (${LEVEL[s.confirmed].toLowerCase()}) needs review: a critical gate no longer passes.`);
  else if(RANK[s.eligible]>RANK[lv])lines.push(`Gates passed for ${LEVEL[s.eligible].toLowerCase()}. Waiting for ${s.eligible==='independent'?'the Principal':'the TL'} to confirm.`);
  if(lv!=='notcleared'&&tr.confirmedBy)lines.push(`Confirmed by ${esc(tr.confirmedBy)}, ${fmtDate(tr.confirmedAt)}.${tr.confirmNote?' '+esc(tr.confirmNote):''}`);
  let ctl='';
  if(staff){
    const b=[];
    if(RANK[s.eligible]>=1&&RANK[lv]<1)b.push(`<button class="btn small" data-act="ready" data-lv="supervised">Confirm supervised practice</button>`);
    if(s.eligible==='independent'&&lv!=='independent')b.push(isAdmin()?`<button class="btn small" data-act="ready" data-lv="independent">Confirm independent clearance</button>`:`<span class="hint">The Principal or an admin confirms independent clearance.</span>`);
    if(lv!=='notcleared')b.push(`<button class="btn small danger" data-act="ready" data-lv="notcleared">Withdraw clearance</button>`);
    if(b.length)ctl=`<div class="field"><input type="text" id="rd-note" placeholder="Note (optional)" aria-label="Note for this decision"></div><div class="row">${b.join('')}</div>`;
  }
  return`<div class="ready ${lv}" role="status"><h2>${LEVEL[lv]}</h2>${lines.map(l=>`<p>${l}</p>`).join('')}${ctl}</div>`;
}

function pathHtml(tr,cyc){
  const s=tr.stats,N=D.config.cycles,starts=new Set(D.config.phases.map(p=>p.from)),cal=tr.cal||[],sg=D.config.supervisedGateCycle;
  let h='';
  for(let c=1;c<=N;c++){
    const f=s.fractions[c-1]||0,cd=cal[c-1],now=s.calendarState==='active'&&s.expected===c,here=!s.finished&&s.current===c;
    h+=`<button class="node ${c===1?'first':''} ${c===cyc?'sel':''} ${f>=1?'full':''} ${here?'here':''} ${c>1&&(s.fractions[c-2]||0)>=1?'done':''}" data-act="cycle" data-c="${c}" aria-label="Cycle ${c}, ${Math.round(f*100)} percent done${cd?', '+fmtShort(cd.start)+' to '+fmtShort(cd.end):''}" aria-pressed="${c===cyc}" style="--f:${f*360}deg;${pcv(c)}">
      <span class="dot"><span>${f>=1?ico('check',18):c}</span></span><span class="cl">${starts.has(c)?esc(phaseShort(c)):''}</span><span class="cd">${cd?fmtShort(cd.start):''}</span><span class="now" ${now?'':'style="visibility:hidden"'}>Today</span></button>`;
    if(c===sg&&sg>0&&sg<N)h+=`<div class="gatemark ${RANK[s.effective]>=1?'open':''}"><div class="bar">${ico('shield',16)}</div><span>Supervised practice</span></div>`;
    if(c===N)h+=`<div class="gatemark ${s.effective==='independent'?'open':''}"><div class="bar">${ico('flag',16)}</div><span>Independent cases</span></div>`;
  }
  return h;
}

const nextUp=tr=>D.tasks.filter(t=>t.active&&!['complete','exempt','submitted'].includes(P(tr,t.id).status)).slice(0,3);
const pageBanner=(title,sub)=>`<section class="banner">${HERO_BG}<span class="accent-bar"></span><span class="accent-dot"></span><h1>${esc(title)}</h1>${sub?`<p class="hero-sub">${esc(sub)}</p>`:''}</section>`;
const stat=(n,suffix,icon,label)=>`<div class="stat"><div class="gnum">${n==null?'&ndash;':`<span data-count="${n}">${n}</span>`}<small>${suffix}</small></div><div class="uline"></div><div class="slab">${ico(icon,22)}<span>${label}</span></div></div>`;

function vTrainee(){
  const tr=T(UI.tid);
  if(!tr)return`${pageBanner('Trainee','No trainees yet')}<div class="empty" style="margin-top:24px">${emptyArt('seed')}<h3>No trainees yet</h3><p>${isAdmin()?'Enrol one from the Team tab.':'A trainee will appear here once an admin enrols them.'}</p></div>`;
  const s=tr.stats,cyc=UI.cycle||s.current,N=D.config.cycles,cd=(tr.cal||[])[cyc-1];
  const tasks=D.tasks.filter(t=>t.cycle===cyc&&t.active);
  const mine=D.me.role==='Trainee'&&tr.id===D.me.email;
  const cycTasks=D.tasks.filter(t=>t.cycle===s.current&&t.active),cycDone=cycTasks.filter(t=>['complete','exempt'].includes(P(tr,t.id).status)).length;
  const subj=mine?"You're":"They're",nu=nextUp(tr),diff=s.completion-s.expectedPct,ms=milestones(tr);
  const hint=s.calendarState==='unknown'?'No start date has been set.':s.calendarState==='notstarted'?`Training starts ${fmtDate(tr.start)}.`:diff===0?'Right on the calendar.':`${Math.abs(diff)} percentage point${Math.abs(diff)===1?'':'s'} ${diff>0?'ahead of':'behind'} the calendar.`;
  return`
  <section class="hero2">${HERO_BG}<span class="accent-bar"></span><span class="accent-dot"></span>
    <div>
      <p class="eyebrow">${mine?greeting():'Trainee'}</p>
      <h1>${esc(tr.name)}</h1>
      <p class="hero-sub">${s.finished?`${mine?'You have':'They have'} worked through every cycle.`:`${subj} in cycle ${s.current}, ${esc(phaseShort(s.current))}: ${cycDone} of ${cycTasks.length} tasks complete.`}</p>
      <div class="chips"><span class="chip">${esc(tr.pathway)} pathway</span>${paceChip(tr)}<span class="chip">Started ${fmtDate(tr.start)}</span><span class="chip">${tr.assessorNames.length?'Assessors: '+tr.assessorNames.map(esc).join(', '):'No assessor assigned yet'}</span></div>
      <div class="hero-actions"><button class="btn ghost small" data-act="export-tracker">Download tracker (CSV)</button></div></div>
    <div class="board"><div class="stats">${stat(s.completion,'/100','user',(mine?'Your':'Their')+'<br>completion')}${stat(s.expectedPct,'/100','calendar','Calendar<br>expects')}</div><p class="hint">${hint}</p></div>
    ${readyCard(tr)}
  </section>
  ${mine&&CHANGES?changesCard():''}
  <section class="badges" aria-label="Milestones"><h3>${ico('star')} Milestones <span class="hint">${ms.filter(m=>m.on).length} of ${ms.length}</span></h3><ul class="medals">${ms.map(m=>`<li class="medalitem ${m.on?'on':'off'} ${NEWBADGES.has(m.id)&&mine?'new':''}">${medal(m.icon,m.on)}<span class="mt">${esc(m.title)}</span><small>${m.on?'Earned':'Locked'}</small></li>`).join('')}</ul></section>
  <div class="pathwrap"><div class="path">${pathHtml(tr,cyc)}</div></div>
  <div class="cols">
    <section><div class="sechead" style="${pcv(cyc)}"><h2>Cycle ${cyc}</h2><span class="muted">${esc(phaseOf(cyc))}${cd?', '+fmtShort(cd.start)+' to '+fmtShort(cd.end):''}, ${tasks.length} task${tasks.length===1?'':'s'}</span></div>
      ${tasks.map(t=>taskCard(tr,t,mine)).join('')||'<div class="empty">No tasks in this cycle.</div>'}</section>
    <aside>
      <div class="card"><div class="stats">${stat(s.competency,'/100','star','Competency')}${stat(s.gatesPassed,'/'+s.gatesTotal,'shield','Gates passed')}</div><p class="hint">Competency is the weighted average score of assessed tasks. A high percentage cannot make up for a critical gate that is not passed.</p></div>
      ${nu.length?`<div class="card"><h3>${ico('target')} Next up</h3><ul class="nextup">${nu.map(t=>`<li><button data-act="goto" data-c="${t.cycle}" data-t="${esc(t.id)}" style="${pcv(t.cycle)}">${ico(TYPE_ICON[t.type]||'target',18)}<b>${esc(t.id)} ${esc(t.name)}</b><small>Cycle ${t.cycle}${t.gate?', critical gate':''}</small></button></li>`).join('')}</ul></div>`:''}
      <div class="card"><details ${openSet.has('gates')?'open':''} data-key="gates"><summary>Critical gates: ${s.gatesPassed} of ${s.gatesTotal}</summary><ul class="gl">${s.gates.map(g=>`<li class="${g.state}"><span class="ic2" aria-hidden="true"></span><span>${esc(g.id)} ${esc(g.name)}<small>${g.state==='pass'?'Passed':g.state==='attention'?'Needs another attempt':'Cycle '+g.cycle}</small></span></li>`).join('')}</ul></details></div>
    </aside>
  </div>`;
}

function filesHtml(tr,t,p,canRemove){
  if(!(p.files||[]).length)return'';
  return`<ul class="files">${p.files.map(f=>{const on=VIEWING.has(f.id),a=`data-tr="${esc(tr.id)}" data-t="${esc(t.id)}" data-fid="${esc(f.id)}"`;
    return`<li><div class="filerow"><span>${esc(f.name)} <span class="hint">${mb(f.size)}</span></span><button class="btn small" data-act="viewfile" ${a} aria-expanded="${on}">${on?'Hide':'View'}</button><button class="btn ghost small" data-act="openfile" ${a}>Download</button>${canRemove?`<button class="btn ghost small" data-act="rmfile" data-t="${esc(t.id)}" data-fid="${esc(f.id)}">Remove</button>`:''}</div><div class="viewer" data-viewer="${esc(f.id)}" ${on?'':'hidden'}></div></li>`}).join('')}</ul>`;
}
function evidenceView(tr,t,p){
  const link=p.evidence?(isUrl(p.evidence)?`<a href="${esc(p.evidence)}" target="_blank" rel="noopener">${esc(p.evidence)}</a>`:esc(p.evidence)):'';
  if(!link&&!(p.files||[]).length)return'<p class="hint">No evidence added.</p>';
  return`${link?`<p>${link}</p>`:''}${filesHtml(tr,t,p,false)}`;
}

function taskCard(tr,t,mine){
  const p=P(tr,t.id),res=resFor(t),key=tr.id+'|'+t.id,staff=isStaff(),sl=slug(key);
  const editable=['not','progress','partial','rework'].includes(p.status);
  let block='';
  const fb=p.feedback?`<b>${p.assessor?esc(p.assessor)+':':'Feedback:'}</b> ${esc(p.feedback)}`:'';
  if(p.status==='complete'||p.status==='exempt')block+=`<div class="note green"><b>${STATUS[p.status]}${p.score?', '+p.score+' of 4, '+SCALE[p.score]:''}.</b> ${fb}<br><span class="hint">${p.date?fmtDate(p.date):''}</span></div>`;
  if(p.status==='partial'||p.status==='rework')block+=`<div class="note ${p.status==='rework'?'red':'amber'}"><b>${STATUS[p.status]}${p.score?', '+p.score+' of 4':''}.</b> ${fb}</div>`;
  if(p.status==='submitted')block+=`<div class="note"><b>Submitted${p.submitted?' '+fmtDate(p.submitted):''}. Waiting for review.</b></div>`;
  if(mine&&editable){
    const ev=dv(tr.id,t.id,'evidence',p.evidence||''),rf=dv(tr.id,t.id,'reflection',p.reflection||'');
    block+=`<div class="myform" data-tr="${esc(tr.id)}" data-t="${esc(t.id)}" style="display:grid;gap:12px">
      <div class="field"><label for="ev-${sl}">Link or reference to your evidence</label><input type="text" id="ev-${sl}" data-f="evidence" value="${esc(ev)}" placeholder="A restricted Drive link, or a Nucleus reference"></div>
      ${filesHtml(tr,t,p,true)}
      <div class="filepick"><input type="file" id="up-${sl}" data-up="${esc(t.id)}"><label class="btn ghost small" for="up-${sl}">Attach a file</label> <span class="hint">PDF, Word (.docx), image, text, mp3, m4a or mp4 can be viewed directly in the app; other Office files can only be downloaded, so a PDF is best. Up to ${D.config.maxUploadMb} MB each, ${D.config.maxFiles} files. For anything larger, paste a link.</span></div>
      <div class="field"><label for="rf-${sl}">Reflection (optional)</label><textarea id="rf-${sl}" data-f="reflection" placeholder="What went well, what you would do differently, what you are unsure about">${esc(rf)}</textarea><span class="hint">Do not write student names or case details. Use initials or a reference.</span></div>
      <div class="row"><button class="btn ghost" data-act="save">Save draft</button><button class="btn" data-act="submit">Submit for review</button></div></div>`;
  }else if(p.status!=='not'||p.evidence||(p.files||[]).length){

/* ---------- assessing ---------- */
function assessForm(tr,t,p){
  const sl=slug(tr.id+'_'+t.id),assessed=['complete','partial','rework','exempt'].includes(p.status);
  const oc=dv(tr.id,t.id,'outcome',assessed?p.status:''),sc=dv(tr.id,t.id,'score',assessed&&p.score?String(p.score):''),fb=dv(tr.id,t.id,'feedback',assessed?p.feedback:'');
  const outs=Object.keys(OUTCOME).filter(k=>!(k==='exempt'&&t.gate));
  return`<div class="assessform" data-tr="${esc(tr.id)}" data-t="${esc(t.id)}" data-gate="${t.gate}">
    <h4>${assessed?'Update assessment':p.status==='submitted'?'Assess this submission':'Record an assessment'}</h4>
    ${p.status==='not'||p.status==='progress'?'<p class="hint">Use this for tasks you observe directly, such as role plays, vivas and observed sessions. The trainee does not have to submit anything first.</p>':''}
    <fieldset><legend class="hint">Outcome</legend><div class="seg">${outs.map(k=>`<input type="radio" name="oc-${sl}" id="oc-${sl}-${k}" value="${k}" data-f="outcome" ${oc===k?'checked':''}><label for="oc-${sl}-${k}"><b>${OUTCOME[k][0]}</b><span class="hint" style="display:block">${OUTCOME[k][1]}</span></label>`).join('')}</div></fieldset>
    <fieldset><legend class="hint">Score${t.gate?` (a critical gate needs ${D.config.passScore} or more to be Complete)`:''}</legend><div class="scale">${[1,2,3,4].map(s=>`<input type="radio" name="sc-${sl}" id="sc-${sl}-${s}" value="${s}" data-f="score" ${sc===String(s)?'checked':''}><label for="sc-${sl}-${s}"><b>${s}</b>${SCALE[s]}</label>`).join('')}</div></fieldset>
    <div class="field"><label for="fb-${sl}">Feedback and development goal</label><textarea id="fb-${sl}" data-f="feedback">${esc(fb)}</textarea></div>
    <div class="row"><button class="btn" data-act="assess">Save assessment</button>${assessed&&p.assessor?`<span class="hint">Last by ${esc(p.assessor)}, ${fmtDate(p.date)}</span>`:''}</div>
  </div>`;
}

const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

  <p class="muted">Finishing the tasks is not the aim. The aim is to show, to people who watch you work, that you are ready to work safely with students.</p>
  <section><h2>The shape of it</h2><p>${c.cycles} cycles of ${c.daysPerCycle} working days (Sundays are not counted), so up to ${c.cycles*c.daysPerCycle} working days. That is the longest it should take. You can move faster if the work is ready.</p></section>
  <section><h2>Two numbers, and a gate</h2><dl><dt>Training completion</dt><dd>How much of the programme an assessor has marked Complete, weighted by topic. Partial counts half.</dd><dt>Competency</dt><dd>How well you did, as an average of assessed scores.</dd><dt>Critical gates</dt><dd>Safety-critical tasks such as confidentiality, escalation, boundaries, referral, documentation and basic counselling skills. Each needs Complete with a score of ${c.passScore} or more. A high percentage cannot make up for a gate that is not passed.</dd></dl></section>
  <section><h2>Scores</h2><dl>${[1,2,3,4].map(s=>`<dt>${s}</dt><dd>${SCALE[s]}</dd>`).join('')}</dl></section>
  <section><h2>What an assessor can decide</h2><dl>${Object.keys(OUTCOME).map(k=>`<dt>${OUTCOME[k][0]}</dt><dd>${OUTCOME[k][1]}.</dd>`).join('')}</dl></section>
  <section><h2>Readiness</h2><dl><dt>${LEVEL.notcleared}</dt><dd>You are learning and practising. No cases on your own.</dd><dt>${LEVEL.supervised}</dt><dd>You can take cases with a supervisor. The TL confirms this once the critical gates through cycle ${c.supervisedGateCycle} are passed.</dd><dt>${LEVEL.independent}</dt><dd>Every critical gate is passed and the Principal has signed off.</dd></dl></section>
  <section><h2>Who does what</h2><dl><dt>Trainee</dt><dd>Does the tasks and adds evidence.</dd><dt>Team Leader</dt><dd>Main assessor. Observes, gives feedback and recommends readiness.</dd><dt>Principal</dt><dd>Signs off institutional readiness after reviewing the competency summary, the gates and the TL's recommendation.</dd></dl></section>
  <section><h2>Evidence</h2><p>Tasks that are watched live (role plays, vivas, observed sessions) are assessed by the assessor on the spot, so you may have nothing to upload. Where you do add evidence, keep students anonymous: use initials or a reference, never full names or case detail. Recording sessions is never required by default and only happens where consent and privacy rules allow.</p></section>
  <section><h2>Other pathways</h2><dl><dt>Experienced hire</dt><dd>Your assessor can mark non-gate tasks Exempt where you have already shown the skill. Gates are always assessed.</dd><dt>Urgent hire</dt><dd>The safety gates come first (through cycle ${c.urgentGateCycle}). Supervised cases can start while the rest of the training continues. Urgency never grants independent clearance.</dd></dl></section></div>`;
}

/* ---------- CSV export ---------- */
function csvCell(v){v=String(v==null?'':v);return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function download(name,rows){
  const text='﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function exportTracker(tr){
  const rows=[['Cycle','Phase','Topic','Task ID','Task','Type','Critical gate','Status','Score /4','Assessed by','Date assessed','Feedback','Evidence link','Files']];
  D.tasks.filter(t=>t.active).forEach(t=>{const p=P(tr,t.id);rows.push(['C'+t.cycle,phaseOf(t.cycle),topicOf(t.topic).name,t.id,t.name,t.type,t.gate?'Yes':'No',STATUS[p.status],p.score||'',p.assessor||'',p.date||'',p.feedback||'',p.evidence||'',(p.files||[]).map(f=>f.name).join('; ')])});
  download('tracker-'+tr.name.replace(/\W+/g,'-')+'.csv',rows);
}
function exportTeam(){
  const rows=[['Trainee','Email','Pathway','Started','Assessors','Current cycle','Points behind calendar','Completion %','Competency %','Gates passed','Gates total','Readiness','Reviews waiting','Active']];
  D.trainees.forEach(tr=>{const s=tr.stats;rows.push([tr.name,tr.id,tr.pathway,tr.start,tr.assessorNames.join('; '),s.current,Math.max(0,-paceGap(tr)),s.completion,s.competency==null?'':s.competency,s.gatesPassed,s.gatesTotal,LEVEL[s.effective],s.pending,tr.active?'Yes':'No'])});
  download('team-summary.csv',rows);
}

/* ---------- events ---------- */
const readB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(new Error('Could not read that file.'));r.readAsDataURL(f)});
const MIME={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',txt:'text/plain',mp3:'audio/mpeg',m4a:'audio/mp4',mp4:'video/mp4',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};
const CDN={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/',mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'};
const extOf=n=>(String(n).split('.').pop()||'').toLowerCase();
async function getFile(trId,taskId,fid){
  if(FILES[fid])return FILES[fid];
  const f=await call('getEvidenceFile',trId,taskId,fid);
  const bin=atob(f.data),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return FILES[fid]={name:f.name,bytes:u8,url:null};
}
const blobUrl=f=>f.url||(f.url=URL.createObjectURL(new Blob([f.bytes],{type:MIME[extOf(f.name)]||'application/octet-stream'})));
async function openFile(trId,taskId,fid){
  try{toast('Preparing file…');const f=await getFile(trId,taskId,fid);
    const a=document.createElement('a');a.href=blobUrl(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast('Downloaded '+f.name);
  }catch(e){toast((e&&e.message)||String(e),true)}
}
const scriptP={};
function loadScript(src){return scriptP[src]||(scriptP[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete scriptP[src];rej(new Error('Could not load the viewer. Check your connection.'))};document.head.appendChild(s)}))}
async function pdfLib(){
  await loadScript(CDN.pdf+'pdf.min.js');
  if(!window.pdfjsLib.GlobalWorkerOptions.workerSrc||!/^blob:/.test(window.pdfjsLib.GlobalWorkerOptions.workerSrc)){
    const code=await (await fetch(CDN.pdf+'pdf.worker.min.js')).text();  // a blob worker avoids cross-origin worker limits
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
  }
  return window.pdfjsLib;
}
async function showPdf(el,f){
  const lib=await pdfLib(),pdf=await lib.getDocument({data:f.bytes.slice()}).promise,max=Math.min(pdf.numPages,30);
  const wrap=document.createElement('div');wrap.className='pdfpages';el.innerHTML='';el.appendChild(wrap);
  const width=Math.max(320,Math.min(el.clientWidth||720,900)),dpr=window.devicePixelRatio||1;
  for(let i=1;i<=max;i++){
    const page=await pdf.getPage(i),w0=page.getViewport({scale:1}).width,vp=page.getViewport({scale:width/w0*dpr});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.setAttribute('role','img');c.setAttribute('aria-label','Page '+i+' of '+pdf.numPages);
    wrap.appendChild(c);await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  }
  if(pdf.numPages>max){const p=document.createElement('p');p.className='hint';p.textContent='Showing the first '+max+' of '+pdf.numPages+' pages. Download the file to read the rest.';el.appendChild(p)}
}
async function showDocx(el,f){
  await loadScript(CDN.mammoth);
  const r=await window.mammoth.convertToHtml({arrayBuffer:f.bytes.buffer.slice(f.bytes.byteOffset,f.bytes.byteOffset+f.bytes.byteLength)});
  const fr=document.createElement('iframe');fr.className='vdoc';fr.title=f.name;fr.setAttribute('sandbox','');  // no scripts can run inside the document
  fr.srcdoc='<!doctype html><meta charset="utf-8"><style>body{font:15px/1.55 system-ui,sans-serif;margin:14px;color:#1c2b36;background:#fff}img{max-width:100%}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 8px}</style>'+r.value;
  el.innerHTML='';el.appendChild(fr);
}
async function renderViewer(el,f){
  const ext=extOf(f.name);el.innerHTML='<p class="hint">Loading…</p>';
  try{
    if(ext==='pdf')await showPdf(el,f);
    else if(ext==='png'||ext==='jpg'||ext==='jpeg')el.innerHTML=`<img class="vimg" alt="${esc(f.name)}" src="${blobUrl(f)}">`;
    else if(ext==='txt')el.innerHTML=`<pre class="vtext">${esc(new TextDecoder('utf-8').decode(f.bytes.slice(0,200000)))}</pre>`;
    else if(ext==='mp3'||ext==='m4a')el.innerHTML=`<audio controls src="${blobUrl(f)}" style="width:100%"></audio>`;
    else if(ext==='mp4')el.innerHTML=`<video controls src="${blobUrl(f)}" style="max-width:100%"></video>`;
    else if(ext==='docx')await showDocx(el,f);
    else el.innerHTML='<p class="note">This kind of file cannot be shown in the app. Use Download to open it, or ask the trainee to upload a PDF.</p>';
  }catch(e){el.innerHTML=`<p class="note red">${esc((e&&e.message)||e)} You can still use Download.</p>`}
}
const viewerEl=fid=>document.querySelector(`[data-viewer="${CSS.escape(fid)}"]`);
async function toggleViewer(trId,taskId,fid){
  const box=viewerEl(fid),btn=document.querySelector(`[data-act=viewfile][data-fid="${CSS.escape(fid)}"]`);
  if(!box)return;
  if(VIEWING.has(fid)){VIEWING.delete(fid);box.hidden=true;box.innerHTML='';if(btn){btn.textContent='View';btn.setAttribute('aria-expanded','false')}return}
  VIEWING.add(fid);box.hidden=false;box.innerHTML='<p class="hint">Loading…</p>';if(btn){btn.textContent='Hide';btn.setAttribute('aria-expanded','true')}
  try{const f=await getFile(trId,taskId,fid);if(VIEWING.has(fid)){const b=viewerEl(fid);if(b)await renderViewer(b,f)}}
  catch(e){VIEWING.delete(fid);const b=viewerEl(fid);if(b){b.hidden=true;b.innerHTML=''}if(btn){btn.textContent='View';btn.setAttribute('aria-expanded','false')}toast((e&&e.message)||String(e),true)}
}
function mountViewers(){VIEWING.forEach(fid=>{const el=viewerEl(fid);if(el&&FILES[fid]&&!el.firstChild)renderViewer(el,FILES[fid])})}
const checked=n=>Array.from(document.querySelectorAll(`input[name="${n}"]:checked`)).map(x=>x.value);
const val=id=>{const e=document.getElementById(id);return e?e.value:''};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='archived'){UI.archived=b.checked;render();return}
  if(b.tagName!=='BUTTON')return;
  const ds=b.dataset,form=b.closest('.myform')||b.closest('.assessform');
  switch(a){
    case'view':UI.view=ds.v;UI.cycle=null;render();break;
    case'cycle':UI.cycle=+ds.c;render();break;
    case'open':UI.tid=ds.id;UI.view='trainee';UI.cycle=null;render();break;
    case'export-tracker':exportTracker(T(UI.tid));break;
    case'export-team':exportTeam();break;
    case'save':case'submit':{
      const id=form.dataset.t,ev=$('[data-f=evidence]',form).value,rf=$('[data-f=reflection]',form).value;
      if(a==='submit'&&!ev.trim()&&!(P(T(UI.tid),id).files||[]).length){toast('Add a link, reference or file as evidence before submitting.',true);return}
      openSet.add(UI.tid+'|'+id);
      run('saveMyTask',[id,a,ev,rf],a==='submit'?'Submitted for review':'Draft saved',null,()=>{delete DRAFT[dk(UI.tid,id,'evidence')];delete DRAFT[dk(UI.tid,id,'reflection')]});break}
    case'rmfile':openSet.add(UI.tid+'|'+ds.t);run('removeEvidence',[ds.t,ds.fid],'File removed');break;
    case'openfile':openFile(ds.tr,ds.t,ds.fid);break;
    case'viewfile':toggleViewer(ds.tr,ds.t,ds.fid);break;
    case'rvfilter':UI.rvFilter=ds.id||null;render();break;
    case'dismiss-changes':CHANGES=null;render();break;
    case'goto':{UI.cycle=+ds.c;openSet.add(UI.tid+'|'+ds.t);render();const el=document.querySelector(`[data-key="${CSS.escape(UI.tid+'|'+ds.t)}"]`);if(el)el.scrollIntoView({block:'center',behavior:REDUCED?'auto':'smooth'});break}
    case'assess':{
      const tr=form.dataset.tr,id=form.dataset.t,oc=$('input[data-f=outcome]:checked',form),sc=$('input[data-f=score]:checked',form);
      if(!oc){toast('Choose an outcome.',true);return}
      openSet.add(tr+'|'+id);
      run('assessTask',[tr,id,oc.value,sc?+sc.value:'',$('[data-f=feedback]',form).value],'Assessment saved',null,()=>['outcome','score','feedback'].forEach(f=>delete DRAFT[dk(tr,id,f)]));break}
    case'ready':run('confirmReadiness',[UI.tid,ds.lv,val('rd-note')],ds.lv==='notcleared'?'Clearance withdrawn':'Readiness confirmed',null,()=>{if(ds.lv!=='notcleared')celebrate(true)});break;
    case'enrol':run('enrolTrainee',[val('nt-name'),val('nt-email'),checked('nt-as'),val('nt-path'),val('nt-start')],'Trainee enrolled');break;
    case'edit-trainee':UI.editTrainee=ds.id;render();{const p=document.getElementById('et');if(p)p.scrollIntoView({block:'center'})}break;
    case'trainee-cancel':UI.editTrainee=null;render();break;
    case'trainee-save':run('updateTrainee',[UI.editTrainee,{name:val('et-name'),start:val('et-start'),pathway:val('et-path'),assessors:checked('et-as'),active:document.getElementById('et-active').checked}],'Saved',null,()=>{UI.editTrainee=null});break;
    case'staff-add':run('saveStaff',[val('sf-email'),val('sf-name'),val('sf-role')],'Staff member saved');break;
    case'staff-remove':if(confirm('Remove '+ds.email+' from the staff list?'))run('removeStaff',[ds.email],'Removed');break;
    case'log':call('getActivityLog').then(l=>{UI.log=l;render()}).catch(er=>toast(er.message,true));break;
    case'ph-add':PH.push({name:'',from:1,to:D.config.cycles});render();break;
    case'ph-del':PH.splice(+ds.i,1);render();break;
    case'settings-save':run('saveSettings',[SET,PH],'Settings saved',null,()=>{SET=null;PH=null});break;
    case'topic-edit':{const t=D.topics.find(x=>x.id===+ds.id);UI.editTopic=t.id;UI.tpf={id:t.id,name:t.name,w:t.w,note:t.note};render();break}
    case'topic-new':UI.editTopic='new';UI.tpf={name:'',w:0,note:''};render();break;
    case'topic-cancel':UI.editTopic=null;render();break;
    case'topic-save':run('saveTopic',[Object.assign({},UI.tpf,{id:UI.editTopic==='new'?'':UI.editTopic})],'Topic saved',null,()=>{UI.editTopic=null});break;
    case'task-edit':{const t=D.tasks.find(x=>x.id===ds.id);UI.editTask=t.id;UI.tf=Object.assign({},t);render();break}
    case'task-new':{const tp=+ds.topic,ns=D.tasks.filter(t=>t.topic===tp).map(t=>+String(t.id).split('.')[1]||0);
      UI.editTask='new:'+tp;UI.tf={id:tp+'.'+((ns.length?Math.max(...ns):0)+1),name:'',topic:tp,cycle:1,type:D.config.taskTypes[1],weight:1,gate:false,what:'',standard:'',evidence:''};render();break}
    case'task-cancel':UI.editTask=null;UI.tf=null;render();break;
    case'task-save':{const isNew=UI.editTask.startsWith('new:');run('saveTask',[UI.tf,isNew],'Task saved',null,()=>{UI.editTask=null;UI.tf=null});break}
    case'task-archive':run('setTaskActive',[ds.id,false],'Task archived');break;
    case'task-restore':run('setTaskActive',[ds.id,true],'Task restored');break;
    case'res-add':RES[ds.scope].push({label:'',url:'',note:''});render();break;
    case'res-del':RES[ds.scope].splice(+ds.i,1);render();break;
    case'res-save':run('saveResources',[+ds.topic,ds.task,RES[ds.scope]],'Resources saved',null,()=>{delete RES[ds.scope]});break;
  }
});

document.addEventListener('input',e=>{
  const el=e.target,ds=el.dataset;
  if(ds.f){const box=el.closest('.myform')||el.closest('.assessform');if(box&&(ds.f==='evidence'||ds.f==='reflection'||ds.f==='feedback'))DRAFT[dk(box.dataset.tr,box.dataset.t,ds.f)]=el.value}
  if(ds.set!=null)SET[ds.set]=el.value;
  if(ds.ph!=null)PH[+ds.ph][ds.pf]=el.value;
  if(ds.tpf)UI.tpf[ds.tpf]=el.value;
  if(ds.tf)UI.tf[ds.tf]=el.type==='checkbox'?el.checked:(['topic','cycle'].includes(ds.tf)?+el.value:el.value);
  if(ds.rs)RES[ds.rs][+ds.i][ds.rf]=el.value;
});

document.addEventListener('change',async e=>{
  const el=e.target,ds=el.dataset;
  if(ds.act==='pick'){UI.tid=el.value;UI.cycle=null;render();return}
  if(ds.f==='outcome'||ds.f==='score'){
    const box=el.closest('.assessform');DRAFT[dk(box.dataset.tr,box.dataset.t,ds.f)]=el.value;
    if(ds.f==='score'){ // sensible default outcome, never overriding a deliberate choice
      const cur=$('input[data-f=outcome]:checked',box),s=+el.value,low=box.dataset.gate==='true'&&s<D.config.passScore;
      const want=low?'rework':(s>=2?'complete':'rework');
      if(!cur||(cur.value==='complete'&&low)){const r=$(`input[data-f=outcome][value=${want}]`,box);if(r){r.checked=true;DRAFT[dk(box.dataset.tr,box.dataset.t,'outcome')]=want}}
    }
    return;
  }
  if(ds.staffrole){run('saveStaff',[ds.staffrole,ds.name,el.value],'Role updated');return}
  if(ds.up!=null){
    const file=el.files[0];if(!file)return;
    if(file.size>D.config.maxUploadMb*1048576){toast('That file is larger than '+D.config.maxUploadMb+' MB. Share a link instead.',true);el.value='';return}
    try{const b64=await readB64(file);openSet.add(UI.tid+'|'+ds.up);run('uploadEvidence',[ds.up,file.name,file.type||'application/octet-stream',b64],'File attached','Uploading…')}
    catch(er){toast(er.message,true)}
  }
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details[data-key]')){d.open?openSet.add(d.dataset.key):openSet.delete(d.dataset.key)}},true);

render();
call('getBootstrap').then(d=>{setData(d);detectChanges();render()}).catch(e=>{$('#app').innerHTML=`<div class="center"><h2>The app couldn't load</h2><p class="muted">${esc((e&&e.message)||e)}</p></div>`});
</script>
